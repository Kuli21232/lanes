name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "Lanes $GITHUB_REF_NAME"

  binaries:
    needs: prepare
    strategy:
      matrix:
        include:
          - os: windows-latest
            archive: lanes-windows-x64.zip
          - os: ubuntu-latest
            archive: lanes-linux-x64.tar.gz
          - os: macos-latest
            archive: lanes-macos-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux UI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libfontconfig1-dev libfreetype6-dev
      - run: cargo build --release -p lanes-core -p lanes-desktop
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          LANES_PAYLOAD_DIR: ${{ github.workspace }}/target/release
        run: cargo build --release -p lanes-installer --features bundled
      - name: Package Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/release/lanes.exe,target/release/lanes-desktop.exe -DestinationPath "${{ matrix.archive }}"
      - name: Package Unix binaries
        if: runner.os != 'Windows'
        run: tar -C target/release -czf "${{ matrix.archive }}" lanes lanes-desktop
      - name: Upload binary archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" "${{ matrix.archive }}" --clobber
      - name: Upload Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          Copy-Item target/release/lanes-installer.exe lanes-setup-windows-x64.exe
          gh release upload $env:GITHUB_REF_NAME lanes-setup-windows-x64.exe --clobber
